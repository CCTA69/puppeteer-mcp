name: Browser tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      # Use Ubuntu's preinstalled Chrome with its existing AppArmor profile.
      - if: runner.os == 'Linux'
        run: echo "PUPPETEER_EXECUTABLE_PATH=/opt/google/chrome/chrome" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm test
      - run: npm run test:stress
      - name: Check generated files match source
        shell: bash
        run: |
          git diff --exit-code -- build
          test -z "$(git ls-files --others --exclude-standard -- build)"
